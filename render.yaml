services:
  - type: web
    name: ssa-accounting-website
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ssa-accounting-db
          property: connectionString

databases:
  - name: ssa-accounting-db
    plan: free
    databaseName: ssa_accounting
    user: ssa_user
